services:
  mysql:
    build: ./database
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 30

  backend:
    build:
      context: ./backend
      args:
        NODE_VERSION: ${NODE_VERSION:-20}
    environment:
      PORT: 3000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: rootpass
      DB_NAME: mior_academy
      JWT_SECRET: secret-ci-pipeline-change-me
      CLIENT_URL: http://localhost:${FRONTEND_PORT:-8090}
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NODE_VERSION: ${NODE_VERSION:-20}
    ports:
      - "${FRONTEND_PORT:-8090}:80"
    depends_on:
      - backend