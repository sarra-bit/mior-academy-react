server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # l'API w les routes de santé vont vers le conteneur backend
  location /api/ {
    proxy_pass http://backend:3000;
    proxy_set_header Host $host;
  }
  location /health {
    proxy_pass http://backend:3000;
  }
  location /version {
    proxy_pass http://backend:3000;
  }

  # routes React (react-router) : toujours renvoyer index.html
  location / {
    try_files $uri /index.html;
  }
}